name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test both architectures
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform linux/$arch --build-arg VERSION="$VERSION" --load -t relay-test:$arch .
            test "$(docker run --rm --platform linux/$arch relay-test:$arch version)" = "$VERSION"
            docker run --rm --platform linux/$arch relay-test:$arch services | grep -q '^bark$'
          done
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/krabdo/tg-notification-relay:${{ github.ref_name }}
            ghcr.io/krabdo/tg-notification-relay:latest
            ghcr.io/krabdo/tg-notification-relay:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/krabdo/tg-notification-relay
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Verify published manifest
        env:
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect ghcr.io/krabdo/tg-notification-relay:$VERSION
          echo "Published digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
